name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish log and jar to ci-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          grep -E "error:|warning: \[|FAILED|What went wrong|Caused by|Could not" build.log | head -300 > /tmp/out/errors.txt || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          GJ=$(find ~/.gradle -name 'geckolib-forge-1.20.1-*.jar' ! -name '*sources*' 2>/dev/null | head -1)
          echo "geckolib jar: $GJ" > /tmp/out/api.txt
          if [ -n "$GJ" ]; then
            for c in software.bernie.geckolib.renderer.GeoRenderer software.bernie.geckolib.renderer.GeoEntityRenderer software.bernie.geckolib.renderer.layer.GeoRenderLayer software.bernie.geckolib.cache.object.GeoBone software.bernie.geckolib.cache.object.BakedGeoModel software.bernie.geckolib.model.GeoModel software.bernie.geckolib.core.animation.AnimationState software.bernie.geckolib.core.animation.AnimationController software.bernie.geckolib.core.animation.RawAnimation software.bernie.geckolib.core.animatable.model.CoreGeoBone software.bernie.geckolib.util.RenderUtils; do
              echo "=== $c" >> /tmp/out/api.txt
              javap -p -cp "$GJ" "$c" >> /tmp/out/api.txt 2>&1 || true
            done
          fi
          echo "${{ steps.build.outcome }}" > /tmp/out/outcome.txt
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ci output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
